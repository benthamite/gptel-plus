name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ['29.1', '29.4', '30.1', snapshot]
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Clone dependencies
        run: |
          git clone --depth 1 https://github.com/karthink/gptel.git ../gptel
          git clone --depth 1 https://github.com/magit/transient.git ../transient

      - name: Run tests
        run: make test
